[package]
name = "youtube-transcript-mcp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core logic for YouTube Transcript MCP (no I/O)"

[lints]
workspace = true

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.37"
url = "2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

[[bench]]
name = "parser"
harness = false
