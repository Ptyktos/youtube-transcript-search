[package]
name = "youtube-transcript-mcp-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "YouTube Transcript MCP server — Cloudflare Workers"

# Standalone workspace so wrangler can build with wasm32-unknown-unknown
# without needing the root workspace resolver.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
youtube-transcript-mcp-core = { path = "../core" }
worker = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
