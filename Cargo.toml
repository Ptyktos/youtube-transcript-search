[workspace]
resolver = "2"
# worker is compiled by wrangler (wasm32-unknown-unknown), not cargo build --workspace
members = ["crates/core", "crates/native"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
strip = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
